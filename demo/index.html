<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continuum demo</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 24px; }
  #mode { border: 2px solid currentColor; padding: 8px 12px; font-weight: 600; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
  section { border: 1px solid currentColor; padding: 12px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  pre { background: rgb(128 128 128 / .15); padding: 8px; min-height: 6em; white-space: pre-wrap; margin: 8px 0 0; font-size: 13px; }
  button, select { font: inherit; padding: 6px 12px; }
  label { margin-left: 12px; }
</style>
<p id="mode"></p>
<p id="controls" hidden>Simulated device: <select id="device"><option>throw</option><option>ok</option><option>hang</option></select></p>
<p id="force-wrap" hidden><label><input type="checkbox" id="force"> Force a real device failure: send a prompt larger than the model's input quota</label></p>
<div class="cols">
  <section>
    <h2>Firebase alone (PREFER_ON_DEVICE)</h2>
    <button id="run-stock">Run</button>
    <pre id="stock-out"></pre>
  </section>
  <section>
    <h2>With Continuum</h2>
    <button id="run-cont">Run</button>
    <label><input type="checkbox" id="slow"> pause 3s mid-task (reload the page now)</label>
    <pre id="cont-out"></pre>
    <pre id="trace"></pre>
    <p id="status"></p>
  </section>
</div>
<section style="margin-top:16px">
  <h2>Benchmark: stock Firebase vs Continuum</h2>
  <button id="run-bench">Run benchmark (10 runs)</button>
  <pre id="bench-out"></pre>
</section>
<script type="module" src="./main.ts"></script>
